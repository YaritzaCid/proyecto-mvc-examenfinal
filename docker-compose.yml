services:
  postgres:
    image: postgres:16
    container_name: dentplus_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dentplus_u3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: dentplus_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dentplus_u3?schema=public
      SESSION_SECRET: dentplus-secret
    depends_on:
      - postgres

volumes:
  postgres_data: